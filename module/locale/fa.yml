defenders_group: مدافعان پایگاه مرزی
defenders_enabled: افزودن صفحهٔ مدافعان به پایگاه‌های پیش‌قراول
defenders_enabled_tooltip: در ویرایشگر نقشه یک پایگاه را انتخاب کرده، بالای پنل روی «مدافعان» کلیک کنید، سپس انواع نیرو و تعداد را تعیین کنید.
defenders_walls: استقرار نگهبانان پایگاه روی دیوارها و برج‌های نزدیک
defenders_walls_tooltip: مدافعان پایگاه می‌توانند روی دیوارها و برج‌های نزدیک مستقر شوند.
defenders_knights: حملهٔ شوالیه‌های نگهبان هنگام گشت‌زنی
defenders_knights_tooltip: شوالیه‌های نگهبان پایگاه می‌توانند هنگام گشت‌زنی با دشمنان درگیر شوند.
waves_group: تنظیمات موج پایگاه
waves_group_descr: تعداد نیروها در هر موج حملهٔ یک پایگاه مرزی.
waves_exact: اندازهٔ دقیق موج
waves_exact_tooltip: در صفحهٔ «مهاجمان» پایگاه، «اندازه» را روی تعداد نیرو در هر موج یا 0 برای توقف موج‌ها بگذارید.
growth_group: رشد موج‌ها
growth_group_descr: میزان بزرگ‌تر شدن موج‌های پایگاه مرزی در طول بازی.
growth_enabled: رشد موج‌ها
growth_enabled_tooltip: در صفحهٔ «مهاجمان» پایگاه، «رشد» را برای افزودن نیرو به موج‌های بعدی تنظیم کنید یا برای ثابت ماندن اندازه، 0 بگذارید.
jobs_group: موج‌های پایگاه
jobs_enabled: تخصیص وظایف جداگانه به موج‌های پایگاه
jobs_enabled_tooltip: نیروها تا زمانی که تحت کنترل پایگاه هستند بر اساس نقش به گروه‌ها تقسیم می‌شوند.
siege_enabled: شلیک ادوات محاصرهٔ پایگاه در مسیر
siege_enabled_tooltip: ادوات محاصرهٔ پایگاه می‌توانند در مسیر خود برای شلیک به اهداف توقف کنند.
retarget_enabled: حملهٔ موج‌های پایگاه به حریف بعدی
retarget_enabled_tooltip: با شکست خوردن حریف، نیروهای بازماندهٔ پایگاه به سراغ دشمن بعدی می‌روند.
join_enabled: پیوستن موج‌های پایگاه به ارتش هوش مصنوعی
join_enabled_tooltip: نیروهایی که به ارتش هوش مصنوعی می‌پیوندند از فرمان‌های آن پیروی کرده و وظایف پایگاه را رها می‌کنند.
improvements: بهبودها
balance_changes: تغییرات توازن
ai: هوش مصنوعی
waves_interval: فاصلهٔ ثابت میان موج‌ها
waves_interval_tooltip: در صفحهٔ «زمان‌بندی» پایگاه، «فاصله» را روی تأخیر ثابت یا 0 برای زمان‌بندی بازی بگذارید.
qol: سهولت استفاده
map_editor: ویرایشگر نقشه
cat_allies_outposts: متحدان و پایگاه‌های مرزی
cat_outpost_guards: نگهبانان پایگاه مرزی
cat_outposts: پایگاه‌های مرزی
