defenders_group: Защитники аванпоста
defenders_enabled: Добавить вкладку «Защитники» для лагерей
defenders_enabled_tooltip: Выберите лагерь в редакторе карт, нажмите «Защитники» вверху панели, затем выберите типы войск и их число.
defenders_walls: Охрана лагеря занимает ближайшие стены и башни
defenders_walls_tooltip: Защитники лагеря могут занимать позиции на ближайших стенах и башнях.
defenders_knights: Рыцари-охранники атакуют во время патруля
defenders_knights_tooltip: Рыцари из охраны лагеря могут атаковать врагов во время патрулирования.
waves_group: Настройки волн лагерей
waves_group_descr: Сколько войск выходит в каждой волне аванпоста.
waves_exact: Точный размер волны
waves_exact_tooltip: На вкладке «Атакующие» задайте «Размер» равным числу бойцов в волне или 0, чтобы отключить волны.
growth_group: Рост волн
growth_group_descr: Насколько крупнее становятся волны аванпоста по ходу игры.
growth_enabled: Рост волн
growth_enabled_tooltip: На вкладке «Атакующие» задайте «Рост», чтобы увеличивать последующие волны, или 0 для неизменного размера.
jobs_group: Волны лагерей
jobs_enabled: Назначать волнам лагерей отдельные задачи
jobs_enabled_tooltip: Войска делятся на группы по ролям, пока остаются под управлением лагеря.
siege_enabled: Осадные орудия лагерей стреляют по пути
siege_enabled_tooltip: Осадные орудия лагерей могут останавливаться и обстреливать цели на своём маршруте.
retarget_enabled: Волны лагерей атакуют следующего противника
retarget_enabled_tooltip: Выжившие войска лагеря переходят к другому врагу, когда их цель побеждена.
join_enabled: Присоединять волны лагерей к армии ИИ
join_enabled_tooltip: Войска, присоединившиеся к армии ИИ, выполняют её приказы и оставляют задачи лагеря.
improvements: Улучшения
balance_changes: Изменения баланса
ai: ИИ
